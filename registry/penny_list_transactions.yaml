# penny_list_transactions — list transactions from penny-track API
# SPEC §4.2: type: http — first-class HTTP tool entry.
name: penny_list_transactions
title: List penny transactions
description: List financial transactions from penny-track for an inclusive date range.
domain: finance
type: http
http:
  method: GET
  url: "${PENNY_TRACK_URL}/api/receipts"
  headers:
    X-API-Key: "${PENNY_TRACK_API_KEY}"
  params: [from, to]
  timeout: 30
requires:
  - PENNY_TRACK_URL
  - PENNY_TRACK_API_KEY
args:
  - name: from
    field_name: from
    type: string
    required: true
    help: Start of the date range (ISO 8601, inclusive), e.g. 2025-01-01.
  - name: to
    field_name: to
    type: string
    required: true
    help: End of the date range (ISO 8601, inclusive), e.g. 2025-01-31.
output:
  mode: block
  format: json
streaming: false
probe:
  level: connectivity
  method: GET
  url: "${PENNY_TRACK_URL}/api/health"
  timeout: 3
